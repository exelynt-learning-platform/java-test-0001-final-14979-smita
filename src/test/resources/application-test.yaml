spring:
  datasource:
    url: jdbc:h2:mem:booking_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

app:
  jwt:
    secret: test-secret-key-for-booking-app-2026-at-least-32-bytes
    expiration-ms: 3600000

  seed:
    enabled: false
