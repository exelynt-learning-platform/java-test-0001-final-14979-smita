server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: booking-api

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/booking_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

app:
  jwt:
    # Must be at least 32 bytes for HMAC-SHA signing.
    secret: ${JWT_SECRET:booking-api-secret-key-change-this-before-production-2026}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  seed:
    enabled: ${SEED_ENABLED:true}
    admin-username: ${SEED_ADMIN_USERNAME:admin}
    admin-password: ${SEED_ADMIN_PASSWORD:Admin@123}
    user-username: ${SEED_USER_USERNAME:user}
    user-password: ${SEED_USER_PASSWORD:User@123}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}
